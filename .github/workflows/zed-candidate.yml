name: zed-candidate
on:
  pull_request:
  push:
    branches: [main, feat/wl-05-wt-06-pilot-lifecycle-20260906]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified Zed and exercise candidate packing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zed-tool" evidence
          curl --fail --location --silent --show-error --retry 3 https://github.com/zed-pkg/zed-cli/releases/download/v0.3.0/zed-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/zed.tgz"
          printf '%s  %s\n' e380240c96242ab3b29e0e9d14c95ba946d086f20f0732e34d0e5cf47513efc7 "$RUNNER_TEMP/zed.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zed.tgz" -C "$RUNNER_TEMP/zed-tool"
          ZED="$(find "$RUNNER_TEMP/zed-tool" -type f -name zed -print -quit)"
          test -n "$ZED" && chmod +x "$ZED"
          "$ZED" --version > evidence/zed-version.txt
          "$ZED" pack --help > evidence/pack-help.txt
          "$ZED" r2g --help > evidence/r2g-help.txt
          "$ZED" publish --help > evidence/publish-help.txt
          "$ZED" validate > evidence/validate.txt
          "$ZED" pack 2>&1 | tee evidence/pack.log
          # Only public CLI tooling and reports are included; no home/cache/credentials.
          cp "$ZED" evidence/zed
          find .zed-pack -maxdepth 1 -type f -name '*.tar.gz' -exec cp {} evidence/ \;
          git rev-parse HEAD > evidence/source.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zed-candidate-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

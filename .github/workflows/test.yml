name: test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  OWLS_INTERFACES_REF: cfe0b18fe9ae361d94ea0646627cb732465b5496
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out the admitted browser-safe contract and runtime export
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ores-wasm-loaders/owls-interfaces
          ref: ${{ env.OWLS_INTERFACES_REF }}
          path: owls-interfaces
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Record exact public sources and tool versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C owls-interfaces rev-parse HEAD)" = "$OWLS_INTERFACES_REF"
          { git rev-parse HEAD; git -C owls-interfaces rev-parse HEAD; node --version; } > evidence/versions.txt
          tar -czf evidence/source.tar.gz index.mjs package.json .zpkg.toml .zpkg.lock src test fixtures docs LICENSE owls-interfaces/index.mjs owls-interfaces/package.json owls-interfaces/release.mjs owls-interfaces/validate.mjs owls-interfaces/schemas owls-interfaces/fixtures owls-interfaces/contracts owls-interfaces/test owls-interfaces/typescript owls-interfaces/LICENSE
          sha256sum evidence/source.tar.gz > evidence/source.sha256
      - name: Run all combined regressions and contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap test/*.test.mjs | tee evidence/loader.tap
          node --test --test-reporter=tap owls-interfaces/test/*.test.mjs | tee evidence/contract.tap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: loader-conformance-${{ github.sha }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error

  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustc +1.94.0 --version
          cargo +1.94.0 --version
      - name: Capture canonical Rust 1.94 formatting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p manifest-evidence
          cargo +1.94.0 fmt --manifest-path tools/manifest/Cargo.toml
          cp tools/manifest/src/main.rs manifest-evidence/formatted-main.rs
          git diff -- tools/manifest/src/main.rs > manifest-evidence/rustfmt.patch
          sha256sum manifest-evidence/formatted-main.rs > manifest-evidence/formatted-main.sha256
          test -s manifest-evidence/rustfmt.patch
      - name: Require committed source to already be canonical
        shell: bash
        run: git diff --exit-code -- tools/manifest/src/main.rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: manifest-rustfmt-${{ github.sha }}
          path: manifest-evidence/
          retention-days: 30
          if-no-files-found: error

# Repository-level CLI/env contract for governance tooling.
# owls-web-loader is a browser library, not an application CLI. The command
# below is the repository-owned validation entrypoint; no ambient app env is invented.

[help]
url = "https://github.com/ores-wasm-loaders/owls-web-loader"
columns = ["options", "env", "type", "default", "description"]

[env]
files = []

[parse]
command_env = "OWLS_WEB_LOADER_GOVERNANCE_COMMAND"
unknown_options_env = "OWLS_WEB_LOADER_UNKNOWN_OPTIONS"
errors_env = "OWLS_WEB_LOADER_PARSE_ERRORS"
allow_unknown = false

[commands.env-contract]
help = "Validate the repository CLI/environment inventory and fail closed on drift."
env = "OWLS_WEB_LOADER_ENV_CONTRACT"

